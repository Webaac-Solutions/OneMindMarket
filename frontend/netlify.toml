[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[redirects]]
  from = "/robots.txt"
  to = "https://onemind-backend-v2.onrender.com/robots.txt"
  status = 200
  force = true

[[redirects]]
  from = "/sitemap.xml"
  to = "https://onemind-backend-v2.onrender.com/sitemap.xml"
  status = 200
  force = true  

[[redirects]]
  from = "https://www.onemindmarket.in/*"
  to = "https://onemindmarket.in/:splat"
  status = 301
  force = true
